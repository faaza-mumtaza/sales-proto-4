<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #ffffff; display: flex; align-items: center; justify-content: center; }
  #icon { width: 100vw; height: 100vh; display: block; }
  body.maskable { background: #10243e; }
  body.maskable #icon { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<!-- Ikon standar: S emblem merah ~72% pada kanvas putih (geometry terverifikasi: bbox path 86x86 unit) -->
<svg id="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="0" fill="#ffffff"/>
  <g id="logo" transform="translate(9,9) scale(0.53)">
    <path fill="#e32322" d="M33.98,19.33l18.5,12.43c3.83,2.58,7.76,5.09,14.52,5.09,10.53,0,19.91-7.66,19.91-7.66L43.45,0s-4.74,5.22-19.63,14.49C8.19,24.23,0,27.06,0,27.06l56.09,37.72-3.69,2.42-17.99-12.09c-3.82-2.56-7.76-5.09-14.52-5.09C9.36,50.01,0,57.69,0,57.69l43.46,29.21s4.74-5.22,19.63-14.49c15.63-9.74,23.82-12.57,23.82-12.57L30.29,21.75l3.68-2.42Z"/>
  </g>
</svg>
<script>
  // Bila URL diberi hash #maskable:
  // latar navy penuh + S putih mengecil ke safe zone (58%).
  if (location.hash === '#maskable') {
    document.body.classList.add('maskable');
    document.querySelector('rect').setAttribute('fill', 'none');
    document.querySelector('path').setAttribute('fill', '#ffffff');
    document.querySelector('#logo').setAttribute('transform', 'translate(13.5,13.5) scale(0.43)');
  }
</script>
</body>
</html>
